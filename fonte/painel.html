<title>DN Grow Experts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: cabeçalho + faixa de números + funil em colunas (kanban) + painel lateral do expert; aba da fila dos agentes */
:root{
  --bg:#F3F4F8; --surface:#FFFFFF; --surface-2:#ECEEF5; --line:#DADDEA;
  --fg:#141729; --muted:#5C6280; --accent:#3346D3; --accent-soft:#E3E7FD; --accent-fg:#FFFFFF;
  --good:#11845B; --good-soft:#DDF3EA; --warn:#B26A00; --warn-soft:#FBEFD9; --bad:#C2324A; --bad-soft:#FBE3E7;
  --shadow:0 1px 2px rgba(20,23,41,.06),0 8px 24px rgba(20,23,41,.06);
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Manrope",ui-sans-serif,system-ui,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
/* sempre claro: o usuário não quer modo escuro, nem quando o celular está escuro */
:root{color-scheme:light}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5}
.wrap{max-width:1440px;margin:0 auto;padding-inline:20px;padding-block:20px 48px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:40px;height:40px;border-radius:11px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:15px;letter-spacing:-.02em}
.brand h1{font-size:24px;font-weight:800;letter-spacing:-.02em}
.brand p{margin:0;color:var(--muted);font-size:13px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:10px;font-weight:600;font-size:13px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}

.tabs{display:flex;gap:4px;margin-top:20px;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--fg);border-color:var(--accent)}
.tab .count{font-family:var(--f-mono);font-size:11px;background:var(--surface-2);padding:1px 6px;border-radius:99px;margin-left:6px}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-top:20px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kpi .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.kpi .val{font-family:var(--f-display);font-size:28px;font-weight:700;letter-spacing:-.02em;margin-top:2px}
.kpi .sub{font-size:12px;color:var(--muted)}
.kpi.alert .val{color:var(--bad)}

/* board */
.board-wrap{overflow-x:auto;margin-top:20px;padding-bottom:8px}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(232px,1fr);gap:12px;min-width:min-content}
.col{background:var(--surface-2);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:180px}
.col-h{display:flex;flex-direction:column;gap:2px;padding:2px 4px 6px}
.col-h .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.col-h h3{font-size:14px;font-weight:700}
.col-h .n{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.col-h .num{font-family:var(--f-mono);font-size:11px;color:var(--accent);font-weight:500}
.col-h small{color:var(--muted);font-size:12px;line-height:1.35}
.col .empty{font-size:12px;color:var(--muted);border:1px dashed var(--line);border-radius:10px;padding:12px;text-align:center}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow);width:100%}
.card:hover{border-color:var(--accent)}
.card .nm{font-weight:700;font-size:14px;line-height:1.25}
.card .hd{font-size:12px;color:var(--muted)}
.bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.done i{background:var(--good)}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:11px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;font-weight:700;font-size:11px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.next{font-size:12px;color:var(--fg);border-top:1px solid var(--line);padding-top:8px}
.next.late{color:var(--bad)}

.archived{margin-top:24px}
.archived summary{cursor:pointer;color:var(--muted);font-weight:600}
.arch-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}

/* empty state / status */
.notice{margin-top:20px;background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:20px;color:var(--muted)}
.notice b{color:var(--fg)}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,12,25,.45);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--bg);z-index:21;overflow-y:auto;box-shadow:-12px 0 40px rgba(0,0,0,.2);padding:calc(env(safe-area-inset-top,0px) + 20px) 20px calc(env(safe-area-inset-bottom,0px) + 40px)}
.d-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.d-head h2{font-size:24px;font-weight:800;letter-spacing:-.02em}
.d-head .hd{color:var(--muted)}
.stepper{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-top:16px}
.step{border:0;background:none;padding:0;display:flex;flex-direction:column;gap:4px;text-align:left}
.step i{height:6px;border-radius:99px;background:var(--line)}
.step.past i{background:var(--good)}
.step.cur i{background:var(--accent)}
.step span{font-size:10px;color:var(--muted);font-weight:600;line-height:1.2}
.step.cur span{color:var(--fg)}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:14px}
.sec h3{font-size:15px;font-weight:700;margin-bottom:4px}
.sec .why{font-size:12px;color:var(--muted);margin:0 0 10px}
.checks{display:flex;flex-direction:column;gap:2px}
.chk{display:flex;gap:10px;align-items:flex-start;padding:6px 4px;border-radius:8px;cursor:pointer}
.chk:hover{background:var(--surface-2)}
.chk input{margin-top:3px;accent-color:var(--accent);width:16px;height:16px;flex:none}
.chk.on span{color:var(--muted);text-decoration:line-through}
.gate{margin-top:10px;font-size:12px;padding:8px 10px;border-radius:8px;background:var(--warn-soft);color:var(--warn);font-weight:600}
.gate.ok{background:var(--good-soft);color:var(--good)}
.move{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.confirm{margin-top:10px;padding:10px;border-radius:10px;border:1px solid var(--warn);background:var(--warn-soft);font-size:13px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.confirm p{margin:0;flex:1 1 220px;color:var(--fg)}

.agents{display:flex;flex-direction:column;gap:8px}
.agent{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;border:1px solid var(--line);border-radius:10px;padding:10px 12px;flex-wrap:wrap}
.agent .who{font-weight:700;font-size:13px}
.agent .skill{font-family:var(--f-mono);font-size:11px;color:var(--accent)}
.agent .what{font-size:12px;color:var(--muted);margin-top:2px}
.agent > div{flex:1 1 260px;min-width:0}
.agent .btns{display:flex;gap:6px;flex:none}

.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
.fld{display:flex;flex-direction:column;gap:4px}
.fld label{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
.fld input,.fld select,.fld textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
.fld textarea{min-height:90px;resize:vertical}
.fld.full{grid-column:1/-1}

.fit{display:flex;flex-direction:column;gap:8px}
.fit-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}
.fit-row .t{font-size:13px}
.fit-row .t small{display:block;color:var(--muted);font-size:11px}
.dots{display:flex;gap:4px}
.dot{width:26px;height:26px;border-radius:7px;border:1px solid var(--line);background:var(--bg);font-family:var(--f-mono);font-size:11px;padding:0}
.dot.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.score{font-family:var(--f-display);font-size:34px;font-weight:800;letter-spacing:-.02em}

.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:12px}
.hist li{display:grid;grid-template-columns:86px minmax(0,1fr);gap:8px}
.hist time{color:var(--muted)}

/* fila */
.queue{margin-top:20px;display:flex;flex-direction:column;gap:10px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start;justify-content:space-between}
.q > div{flex:1 1 320px;min-width:0}
.q .top-line{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.q .task{margin-top:4px;font-size:13px}
.q select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-top:16px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 12px;font-size:12px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}

/* método */
.method{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-top:20px}
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.mcard .num{font-family:var(--f-mono);font-size:11px;color:var(--accent)}
.mcard h3{font-size:16px;margin:2px 0 4px}
.mcard p{margin:0 0 8px;color:var(--muted);font-size:13px}
.mcard ul{margin:0;padding-left:18px;font-size:13px}
.mcard .ag{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}

.who-row{display:flex;gap:10px;align-items:center;min-width:0}
.who-row > div{min-width:0}
.ava{width:36px;height:36px;border-radius:50%;object-fit:cover;flex:none;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:14px;border:2px solid var(--surface)}
.ava.lg{width:64px;height:64px;font-size:22px;box-shadow:0 0 0 2px var(--accent)}
.d-id{display:flex;gap:14px;align-items:center;min-width:0}
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:10px}
.m{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.m .v{font-family:var(--f-display);font-size:20px;font-weight:700;letter-spacing:-.01em}
.m .l{font-size:11px;color:var(--muted);line-height:1.3}
.m .c{font-size:11px;color:var(--accent);font-weight:600;margin-top:2px}
.leitura{margin-top:12px;font-size:13px;padding:10px 12px;border-radius:10px;background:var(--accent-soft)}
.leitura b{color:var(--accent)}
.docs{margin:10px 0 0;padding-left:18px;font-size:12px;color:var(--muted)}
.mhead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-top:20px}
.mctl{display:flex;gap:10px;flex-wrap:wrap}
.mctl .fld{min-width:180px;flex:1 1 180px}
.mctl select,.mctl input{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
.mtop{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:12px;margin-top:16px}
@media (max-width:640px){.mtop{grid-template-columns:1fr}}
.nextbox{border-color:var(--accent)}
.nextbox .nt{font-family:var(--f-display);font-size:19px;font-weight:700;line-height:1.25;margin-top:4px}
.fases{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.fase{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.fase summary{cursor:pointer;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;list-style:none}
.fase summary::-webkit-details-marker{display:none}
.fase.now{border-color:var(--accent)}
.pill.novo{background:var(--warn-soft);color:var(--warn);font-weight:600;font-size:10px;vertical-align:1px}
.fase .fn{font-size:11px;color:var(--accent)}
.fase .ft{font-family:var(--f-display);font-weight:700;font-size:16px}
.fase .fw{font-size:12px;color:var(--muted);flex:1 1 auto}
.plitems{display:flex;flex-direction:column;margin-top:8px}
.pli{display:grid;grid-template-columns:86px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.pli .pst{border:0;justify-content:center;cursor:pointer}
.pli .pst:disabled{cursor:default}
.pli.feito .plt{color:var(--muted);text-decoration:line-through}
.plb{display:flex;gap:6px}
@media (max-width:640px){.pli{grid-template-columns:86px minmax(0,1fr)}.plq,.plb{grid-column:2}}
.banner{margin-top:16px;font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:13px;z-index:40;max-width:calc(100% - 32px)}
.ro{font-size:12px;color:var(--muted);margin-top:8px}
#numerosFrame{display:block;width:100%;border:0;margin-top:16px;border-radius:14px;min-height:600px;background:var(--bg)}
/* abas sempre numa linha só; no celular rolam para o lado */
.tabs{overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;flex:none}
/* celular: números em 2 colunas, funil em pilha, ficha mais justa */
@media (max-width:640px){
  .wrap{padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-block:14px 40px}
  .mark{width:34px;height:34px;font-size:13px}
  .brand h1{font-size:20px}
  .brand p{font-size:12px}
  .tabs{margin-top:14px;margin-inline:-14px;padding-inline:14px}
  .tab{padding:10px 12px;font-size:13px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:14px}
  .kpi{padding:10px 12px;border-radius:12px}
  .kpi .lbl{font-size:10px;letter-spacing:.06em}
  .kpi .val{font-size:20px}
  .kpi .sub{font-size:11px;line-height:1.35}
  .banner{font-size:11px}
  .board-wrap{overflow:visible;margin-top:14px}
  .board{grid-auto-flow:row;grid-template-columns:minmax(0,1fr);grid-auto-columns:auto;min-width:0}
  .col{min-height:0}
  .drawer{padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
  .d-head h2{font-size:20px}
  .ava.lg{width:52px;height:52px}
  .stepper{grid-template-columns:repeat(4,1fr);row-gap:8px}
  .sec{padding:14px;border-radius:12px}
  .mgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .m .v{font-size:17px}
  .tr{font-size:11px}
  .hist li{grid-template-columns:62px minmax(0,1fr)}
  #numerosFrame{margin-top:12px;border-radius:0;margin-inline:-14px;width:calc(100% + 28px)}
}
/* tráfego do expert */
.m.alerta .v{color:var(--bad)}
.tr-wrap{overflow-x:auto;margin-top:12px}
.tr{width:100%;border-collapse:collapse;font-size:12px}
.tr th,.tr td{text-align:left;padding:6px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.tr th{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;white-space:nowrap}
.tr td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.tr th.n{text-align:right}
.tr td.nm{min-width:180px}
.tr .sub{display:block;color:var(--muted);font-size:11px}
.tr-h{font-size:12px;font-weight:700;margin:14px 0 0;color:var(--fg)}
.cnums{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.cnums div{background:var(--surface-2);border-radius:8px;padding:6px 8px;min-width:0}
.cnums b{display:block;font-size:13px}
.cnums span{display:block;font-size:10px;color:var(--muted);line-height:1.25}
.estr{margin:6px 0 0;padding-left:18px;font-size:13px;display:flex;flex-direction:column;gap:6px}
.mais{margin-top:14px}
.mais > summary{cursor:pointer;font-weight:700;color:var(--muted);font-size:13px;padding:8px 2px}
.pend{margin:10px 0 0;padding-left:18px;font-size:12px}
.pend li{margin:2px 0}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="mark" aria-hidden="true">DN</div>
      <div>
        <h1>DN Grow Experts</h1>
        <p>Funil de experts e possíveis sócios, da indicação à sociedade</p>
      </div>
    </div>
    <div class="actions">
      <button class="btn primary" id="btnNovo" type="button">+ Novo expert</button>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="funil" aria-selected="true">Funil</button>
    <button class="tab" role="tab" data-tab="numeros" aria-selected="false">Números por produto</button>
    <button class="tab" role="tab" data-tab="montagem" aria-selected="false">Montagem do negócio</button>
    <button class="tab" role="tab" data-tab="fila" aria-selected="false">Fila dos agentes <span class="count mono" id="qCount">0</span></button>
    <button class="tab" role="tab" data-tab="metodo" aria-selected="false">Como funciona</button>
  </nav>

  <section id="p-numeros" hidden>
    <!--PROJETOS--><iframe id="numerosFrame" title="Números por projeto e produto" srcdoc="&lt;meta charset=&quot;utf-8&quot;&gt;
&lt;script&gt;if(location.href===&quot;about:srcdoc&quot;)document.documentElement.classList.add(&quot;embed&quot;);&lt;/script&gt;
&lt;title&gt;DN Grow Projetos&lt;/title&gt;
&lt;meta name=&quot;claude:viewport-fit-sides&quot; content=&quot;cover&quot;&gt;
&lt;link rel=&quot;preconnect&quot; href=&quot;https://fonts.googleapis.com&quot;&gt;
&lt;link rel=&quot;stylesheet&quot; href=&quot;https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap&quot;&gt;
&lt;style&gt;
/* Layout: abas por projeto no topo; visão geral = uma tabela de produtos por projeto (mês atual);
   aba do projeto = abinhas por produto, cada uma com o mês e o diário dos últimos 15 dias */
:root{
  --bg:#f5f6f8; --surface:#ffffff; --surface-2:#eef0f4; --ink:#151a24; --mut:#5d6575; --line:#e1e4ea; --grid:#eceef2;
  --accent:#3550c4; --accent-soft:#e8ecfb;
  --ok:#1f7a4d; --ok-soft:#e3f3ea; --warn:#9a6200; --warn-soft:#fbf0dc; --crit:#b3261e; --crit-soft:#fbe6e4;
  --f-display:&quot;Familjen Grotesk&quot;,&quot;Segoe UI&quot;,system-ui,sans-serif;
  --f-body:&quot;IBM Plex Sans&quot;,&quot;Segoe UI&quot;,system-ui,sans-serif;
  --f-mono:&quot;IBM Plex Mono&quot;,ui-monospace,Consolas,monospace;
}
/* sempre claro: o usuário não quer modo escuro, nem quando o celular está escuro */
:root{color-scheme:light}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body)}
body::before{content:&quot;&quot;;position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;padding-block:14px 0}
.brand{font:700 20px/1.1 var(--f-display);letter-spacing:-.01em;margin:0}
.stamp{font:12px var(--f-mono);color:var(--mut)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;width:100%;margin-top:6px}
nav.tabs button{font:600 14px var(--f-body);color:var(--mut);background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected=&quot;true&quot;]{color:var(--ink);border-bottom-color:var(--accent)}
button:focus-visible,a:focus-visible,tr[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
main{padding-block:24px 48px}
h2{font:700 26px/1.15 var(--f-display);letter-spacing:-.015em;margin:0;text-wrap:balance}
h3{font:600 13px var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:0 0 10px}
.lede{color:var(--mut);max-width:72ch;margin:6px 0 0}
.sec{display:grid;gap:20px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;min-width:0}
.ph{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 14px;margin-bottom:10px}
.ph h4{font:700 19px var(--f-display);margin:0}
.ph .tot{font:600 15px var(--f-mono);font-variant-numeric:tabular-nums}
.ph .tot span{font:12px var(--f-body);color:var(--mut)}
.ph .go{margin-left:auto;font:600 13px var(--f-body);background:none;border:1px solid var(--line);border-radius:8px;padding:5px 10px;color:var(--accent);cursor:pointer}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.kpi{background:var(--surface);padding:12px 14px;min-width:0}
.kpi .l{font-size:12px;color:var(--mut)}
.kpi .v{font:600 21px/1.2 var(--f-mono);font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .s{font:12px var(--f-mono);color:var(--mut)}
.kpi.crit .v{color:var(--crit)}
.pill{display:inline-block;font:600 11px var(--f-body);letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:2px 8px;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-warn{background:var(--warn-soft);color:var(--warn)} .p-crit{background:var(--crit-soft);color:var(--crit)} .p-info{background:var(--accent-soft);color:var(--accent)}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--mut);font-weight:600;white-space:nowrap}
td.n,th.n{text-align:right;white-space:nowrap}
td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:13px}
td .sub{display:block;color:var(--mut);font-size:12px}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface-2)}
tr.total td{font-weight:600;border-top:2px solid var(--line)}
td.vazio{color:var(--mut)}
.sub-tabs{display:flex;flex-wrap:wrap;gap:6px}
.sub-tabs button{font:600 13px var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer}
.sub-tabs button[aria-pressed=&quot;true&quot;]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.sub-tabs button span{font:12px var(--f-mono);opacity:.75;margin-left:6px}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto}
.chart .ax{fill:var(--mut);font:11px var(--f-mono)}
.chart .gl{stroke:var(--grid);stroke-width:1}
.chart .bar{fill:var(--accent)}
.chart .bar.dim{opacity:.35}
.chart .hit{fill:transparent;cursor:pointer}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font:12px/1.45 var(--f-body);padding:8px 10px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-100%);margin-top:-8px}
.tip b{font-family:var(--f-mono)}
/* semana a semana (produtos perpétuos) */
.dl{font:11px var(--f-mono);margin-left:4px;white-space:nowrap}
.dl.up{color:var(--ok)} .dl.down{color:var(--crit)} .dl.eq{color:var(--mut)}
.sem-tabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.sem-tabs button{font:600 12px var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 11px;cursor:pointer}
.sem-tabs button[aria-pressed=&quot;true&quot;]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.cri-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.cri{border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;align-items:start;background:var(--surface)}
.cri img,.cri .noimg{width:96px;height:96px;object-fit:cover;border-radius:8px;background:var(--surface-2);display:block}
.cri .rot{font:600 11px var(--f-body);letter-spacing:.05em;text-transform:uppercase}
.cri .rot.bom{color:var(--ok)} .cri .rot.ruim{color:var(--crit)}
.cri .nm{font-size:13px;font-weight:600;line-height:1.3;word-break:break-word}
.cri .cp{font-size:11px;color:var(--mut);word-break:break-word}
.cri .nums{font:12px var(--f-mono);margin-top:4px}
.ajs{margin:0;padding-left:18px;font-size:13px;display:grid;gap:4px}
.leit{font-size:14px;margin:0 0 12px}
.note{font-size:13px;color:var(--mut);margin:10px 0 0}
.estr{counter-reset:p;display:grid;gap:10px;margin:0;padding:0;list-style:none}
.estr li{counter-increment:p;display:grid;grid-template-columns:28px 1fr;gap:10px}
.estr li::before{content:counter(p);font:700 15px var(--f-mono);color:var(--accent);background:var(--accent-soft);border-radius:6px;height:26px;display:grid;place-items:center}
.estr b{font-weight:600}
.semleitura{display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:var(--mut);font-size:14px}
a{color:var(--accent)}
.mono{font-family:var(--f-mono);font-size:13px}
section[hidden]{display:none}
.mob{display:none}
/* dentro do DN Grow Experts o cabeçalho próprio sai: o Experts já tem o dele */
.embed .brand{display:none}
.embed header.top{position:static}
@media (max-width:640px){
  .opc{display:none}
  .mob{display:table-cell}
  .wrap{padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
  main{padding-block:16px 32px}
  h2{font-size:22px}
  .box{padding:14px}
  .ph h4{font-size:17px}
  .ph .go{margin-left:0}
  th,td{padding:7px 6px}
  td .sub{font-size:11px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi .v{font-size:18px}
  .tip{white-space:normal;max-width:220px}
}

const $ = s =&gt; document.querySelector(s);
const esc = s =&gt; String(s ?? &quot;&quot;).replace(/[&amp;&lt;&gt;&quot;&#x27;]/g, c =&gt; ({&quot;&amp;&quot;:&quot;&amp;amp;&quot;,&quot;&lt;&quot;:&quot;&amp;lt;&quot;,&quot;&gt;&quot;:&quot;&amp;gt;&quot;,&#x27;&quot;&#x27;:&quot;&amp;quot;&quot;,&quot;&#x27;&quot;:&quot;&amp;#39;&quot;}[c]));
const brl = (v, d=0) =&gt; v==null||!isFinite(v) ? &quot;—&quot; : &quot;R$ &quot; + v.toLocaleString(&quot;pt-BR&quot;,{minimumFractionDigits:d,maximumFractionDigits:d});
const num = v =&gt; (v||0).toLocaleString(&quot;pt-BR&quot;,{maximumFractionDigits:0});
const div = (a,b) =&gt; b ? a/b : null;
const dm = iso =&gt; iso.slice(8,10)+&quot;/&quot;+iso.slice(5,7);
const met = s =&gt; ({sp:s.sp, lead:s.lead, buy:s.buy, rec:s.rec, cpl:div(s.sp,s.lead), cpa:div(s.sp,s.buy), roas:div(s.rec,s.sp)});

// No celular as colunas de custo viram uma só: CPA em produto de venda, CPL (ou custo por visita) nos outros.
const custo = (x, venda, perfil) =&gt; venda ? `CPA ${brl(x.cpa,0)}` : `${perfil?&quot;visita&quot;:&quot;CPL&quot;} ${brl(x.cpl,2)}`;
// Campanha: em produto de venda, CPA se vendeu e custo por visita se é campanha de perfil; nos outros, CPL.
const custoCamp = (x, ehVenda, rot) =&gt; ehVenda ? (x.buy ? `CPA ${brl(x.cpa,0)}` : x.lead ? `visita ${brl(x.cpl,2)}` : &quot;—&quot;) : `${rot===&quot;leads&quot;?&quot;CPL&quot;:&quot;visita&quot;} ${brl(x.cpl,2)}`;
function linhaProduto(p, proj){
  const m = met(p.mes), venda = p.resultado===&quot;venda&quot;, perfil = p.resultado===&quot;perfil&quot;;
  // CPA e ROAS só fazem sentido em produto de venda; em captação o número que importa é o CPL
  // (em campanha de seguidores, o &quot;lead&quot; é a visita ao perfil).
  return `&lt;tr class=&quot;click&quot; tabindex=&quot;0&quot; data-proj=&quot;${proj}&quot; data-prod=&quot;${esc(p.id)}&quot;&gt;
    &lt;td&gt;${esc(p.nome)}&lt;span class=&quot;sub&quot;&gt;${venda?&quot;venda direta&quot;:perfil?&quot;visitas ao perfil&quot;:&quot;captação de lead&quot;}&lt;/span&gt;&lt;/td&gt;
    &lt;td class=&quot;n&quot;&gt;${brl(m.sp)}&lt;/td&gt;&lt;td class=&quot;n mob&quot;&gt;${custo(m,venda,perfil)}&lt;/td&gt;&lt;td class=&quot;n opc&quot;&gt;${venda?&quot;—&quot;:num(m.lead)}&lt;/td&gt;&lt;td class=&quot;n opc&quot;&gt;${venda?&quot;—&quot;:brl(m.cpl,2)}&lt;/td&gt;
    &lt;td class=&quot;n opc&quot;&gt;${num(m.buy)}&lt;/td&gt;&lt;td class=&quot;n opc&quot;&gt;${venda?brl(m.cpa,2):&quot;—&quot;}&lt;/td&gt;&lt;td class=&quot;n opc&quot;&gt;${brl(m.rec)}&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;${venda&amp;&amp;m.roas?m.roas.toLocaleString(&quot;pt-BR&quot;,{maximumFractionDigits:2}):&quot;—&quot;}&lt;/td&gt;&lt;/tr&gt;`;
}

function renderGeral(){
  $(&quot;#stamp&quot;).textContent = `mês atual · gerado em ${DADOS.geradoEm}`;
  const sem = DADOS.projetos.filter(p=&gt;p.status!==&quot;ok&quot;).length;
  $(&quot;#geralLede&quot;).textContent = `Cada projeto com seus produtos, no mês atual. Clique num produto para ver o detalhe e o diário dos últimos 15 dias.${sem?` ${sem} projeto(s) ainda sem conta de anúncios lida.`:&quot;&quot;}`;

const semSel = {};
const pct = v =&gt; v==null||!isFinite(v) ? &quot;—&quot; : (v*100).toLocaleString(&quot;pt-BR&quot;,{maximumFractionDigits:1})+&quot;%&quot;;

function semMet(s){ return {sp:s.sp, cpc:div(s.sp,s.clk), tp:div(s.ic,s.lpv), tc:div(s.buy,s.ic), buy:s.buy, cpa:div(s.sp,s.buy), roas:div(s.rec,s.sp), rec:s.rec, cri:s.criativos, cpam:s.cpa_medio_criativos}; }
// Variação contra a semana anterior; &quot;sobe&quot; diz se subir é bom (vendas, ROAS) ou ruim (CPA, CPC).
function delta(a, b, sobeBom){
  if(a==null||b==null||!isFinite(a)||!isFinite(b)||!b) return &quot;&quot;;
  const v=(a-b)/b; if(Math.abs(v)&lt;0.005) return `&lt;span class=&quot;dl eq&quot;&gt;=&lt;/span&gt;`;

  return `&lt;span class=&quot;dl ${bom?&quot;up&quot;:&quot;down&quot;}&quot;&gt;${v&gt;0?&quot;▲&quot;:&quot;▼&quot;}${Math.abs(v*100).toLocaleString(&quot;pt-BR&quot;,{maximumFractionDigits:0})}%&lt;/span&gt;`;
}

// Barras do investido diário, com a dica de leads/vendas ao passar o mouse.
function desenharBarras(el, dias, ehVenda){
  const W=640, H=200, L=56, R=8, T=12, B=26, max = Math.max(...dias.map(d=&gt;d.sp), 1);

  let g = &quot;&quot;;
  for(let v=0; v&lt;=topo; v+=passo){ g += `&lt;line class=&quot;gl&quot; x1=&quot;${L}&quot; x2=&quot;${W-R}&quot; y1=&quot;${y(v)}&quot; y2=&quot;${y(v)}&quot;/&gt;&lt;text class=&quot;ax&quot; x=&quot;${L-6}&quot; y=&quot;${y(v)+4}&quot; text-anchor=&quot;end&quot;&gt;${v&gt;=1000?(v/1000).toLocaleString(&quot;pt-BR&quot;)+&quot; mil&quot;:v}&lt;/text&gt;`; }
  dias.forEach((d,i)=&gt;{
    const x = L + i*bw + gap/2, w = bw-gap, h = y(0)-y(d.sp), r = Math.min(4, w/2, h);
    if(d.sp&gt;0) g += `&lt;path class=&quot;bar&quot; data-i=&quot;${i}&quot; d=&quot;M${x},${y(0)} V${y(d.sp)+r} Q${x},${y(d.sp)} ${x+r},${y(d.sp)} H${x+w-r} Q${x+w},${y(d.sp)} ${x+w},${y(d.sp)+r} V${y(0)} Z&quot;/&gt;`;
    if(i%2===0 || i===dias.length-1) g += `&lt;text class=&quot;ax&quot; x=&quot;${x+w/2}&quot; y=&quot;${H-8}&quot; text-anchor=&quot;middle&quot;&gt;${dm(d.dia)}&lt;/text&gt;`;
    g += `&lt;rect class=&quot;hit&quot; data-i=&quot;${i}&quot; x=&quot;${L+i*bw}&quot; y=&quot;${T}&quot; width=&quot;${bw}&quot; height=&quot;${H-T-B}&quot;/&gt;`;
  });
  el.innerHTML = `&lt;svg viewBox=&quot;0 0 ${W} ${H}&quot; role=&quot;img&quot; aria-label=&quot;Investido por dia nos últimos 15 dias&quot;&gt;${g}&lt;/svg&gt;&lt;div class=&quot;tip&quot; hidden&gt;&lt;/div&gt;`;
  const tip = el.querySelector(&quot;.tip&quot;), svg = el.querySelector(&quot;svg&quot;);
  const mostrar = i =&gt; { const d = dias[i], x = met(d), r = svg.getBoundingClientRect(), er = el.getBoundingClientRect();
    el.querySelectorAll(&quot;.bar&quot;).forEach(b=&gt;b.classList.toggle(&quot;dim&quot;, +b.dataset.i!==i));
    tip.innerHTML = `&lt;b&gt;${dm(d.dia)}&lt;/b&gt; · ${brl(x.sp)}&lt;br&gt;${ehVenda?`${num(x.buy)} vendas · CPA ${brl(x.cpa,0)}`:`${num(x.lead)} leads · CPL ${brl(x.cpl,2)}`}`;
    const px = (L + (i+.5)*bw) / W * r.width + (r.left-er.left), py = y(d.sp) / H * r.height + (r.top-er.top);
    tip.style.left = Math.min(Math.max(px, 70), er.width-70)+&quot;px&quot;; tip.style.top = py+&quot;px&quot;; tip.hidden = false; };
  const esconder = () =&gt; { tip.hidden = true; el.querySelectorAll(&quot;.bar&quot;).forEach(b=&gt;b.classList.remove(&quot;dim&quot;)); };
  el.querySelectorAll(&quot;.hit&quot;).forEach(h=&gt;{ h.addEventListener(&quot;mouseenter&quot;,()=&gt;mostrar(+h.dataset.i)); h.addEventListener(&quot;click&quot;,()=&gt;mostrar(+h.dataset.i)); });
  svg.addEventListener(&quot;mouseleave&quot;, esconder);
}

<script>
const STAGES = [

   agents:[["Diagnóstico orgânico","diagnostico-organico-instagram","Raio-X do Instagram: mediana dos Reels, engajamento, frequência e o gargalo do perfil."],["Joana · Mercado","joana-copy-infoproduto","Pesquisa de mercado: concorrentes, preço praticado, Biblioteca de Anúncios e linguagem do público."]]},
  {k:"viabilidade", n:"Viabilidade", why:"A conta tem que fechar no papel antes de fechar na reunião.",

   agents:[["Mídia e Dados","trafego-meta-ads-low-ticket","Conta do CPA máximo e cenários ruim/bom/excelente com o ticket e a base atual."],["Diretor","","Parecer estratégico: vale a pena? Qual modelo (piloto x sociedade) e qual linha de base."]]},
  {k:"proposta", n:"Proposta", why:"Proposta clara, com marcos. Sociedade só depois de prova.",

   agents:[["Apresentação","apresentacao-premium","Deck da proposta para a reunião, com números do Raio-X e da Viabilidade."],["Diretor","","Roteiro da reunião e resposta para cada objeção provável."]]},

   agents:[["Diretor","","Checklist do contrato: quem recebe, percentual, linha de base, marcos e saída. Revisão final com advogado."]]},
  {k:"onboarding", n:"Onboarding", why:"Acessos e ficha completos na primeira semana. Agente sem acesso não trabalha.",
   items:[["bm","Acesso à BM, pixel e conta de anúncio"],["plataforma","Acesso à plataforma de vendas"],["insta","Acesso ao Instagram e ManyChat"],["ficha","Pasta e ficha oficial do expert"],["kickoff","Kickoff gravado"],["verba","Verba de tráfego definida"]],
   agents:[["Diretor","","Ficha oficial do expert e plano dos primeiros 30 dias."],["Mídia e Dados","trafego-meta-ads-low-ticket","Conferir BM, pixel, eventos de compra e a conta de anúncio antes de subir."]]},
  {k:"piloto", n:"Piloto 90 dias", why:"Os agentes trabalham aqui. Cada marco é um número, não uma impressão.",
   items:[["oferta","Oferta e página revisadas"],["criativos","1ª rodada de criativos no ar"],["rotina","Rotina semanal ativa"],["m30","Marco de 30 dias batido"],["m60","Marco de 60 dias batido"],["m90","Marco de 90 dias batido"]],
   agents:[["Joana · Copy","joana-copy-infoproduto","Oferta, página de vendas e textos dos anúncios do expert."],["Criativos","criativos-imagem","Primeira rodada de criativos estáticos, na regra 80/20."],["Vídeo","edicao-video-criativo","Transformar os vídeos do expert em criativos com gancho e legenda."],["Mídia e Dados","trafego-meta-ads-low-ticket","Leitura semanal da campanha: CPA, gargalo e o que pausar ou escalar."]]},
  {k:"socio", n:"Sociedade", why:"Bateu os marcos? Agora a conversa de sociedade tem número na mesa.",

];
const FIT = [["audiencia","Audiência","tamanho e qualidade do público"],["produto","Produto","oferta pronta e que entrega"],["engajamento","Engajamento","o público responde"],["investe","Investe","topa colocar verba em tráfego"],["comercial","Comercial","tem time ou topa montar"]];
const SK = Object.fromEntries(STAGES.map((s,i)=>[s.k,i]));
const QSTAT = [["afazer","A fazer"],["fazendo","Fazendo"],["feito","Feito"]];

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today = () => new Date().toISOString().slice(0,10);
const fmtDate = d => d ? d.split("-").reverse().slice(0,2).join("/") : "";
const brl = v => (Number(v)||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL",maximumFractionDigits:0});
const nfmt = v => (Number(v)||0).toLocaleString("pt-BR");

let db = null, canWrite = true;
let experts = [], pedidos = [], openId = null, pendingMove = null, qFilter = "abertos", maisOpen = false;
const queues = {};
function enqueue(id, fn){ const p = (queues[id]||Promise.resolve()).then(fn, fn); queues[id] = p.catch(()=>{}); return p; }

function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>t.hidden=true,2600); }

function stageProgress(e, k){ const s = STAGES[SK[k]]; const done = s.items.filter(([ik])=>e.checks?.[k+"."+ik]).length; return {done, total:s.items.length}; }
function fitScore(e){ const f=e.fit||{}; return Math.round(FIT.reduce((a,[k])=>a+(Number(f[k])||0),0)/ (FIT.length*5) *100); }
function scoreClass(v){ return v>=70?"good":v>=45?"warn":"bad"; }
function isLate(e){ return e.proximaData && e.proximaData < today(); }

/* ---------- render: KPIs ---------- */
function renderKpis(){
  const ativos = experts.filter(e=>e.status!=="arquivado");
  const socios = ativos.filter(e=>e.etapa==="socio").length;
  const piloto = ativos.filter(e=>e.etapa==="piloto").length;
  const lidos = ativos.filter(e=>e.trafego?.status==="ok");
  const semAcesso = ativos.filter(e=>e.trafego?.status==="sem_acesso").length;
  const inv = lidos.reduce((a,e)=>a+(Number(e.trafego.investido)||0),0);
  const fat = lidos.reduce((a,e)=>a+(Number(e.trafego.faturamento)||0),0);
  const abertos = pedidos.filter(p=>p.status!=="feito").length;
  $("#kpis").innerHTML = `
    <div class="kpi"><div class="lbl">Experts</div><div class="val mono">${ativos.length}</div><div class="sub">${socios} sócio(s) · ${piloto} em piloto</div></div>
    <div class="kpi"><div class="lbl">Investido em tráfego no mês</div><div class="val mono">${brl(inv)}</div><div class="sub">${lidos.length} conta(s) lida(s)</div></div>
    <div class="kpi"><div class="lbl">Faturamento no pixel no mês</div><div class="val mono">${brl(fat)}</div><div class="sub">${inv?`${(fat/inv).toLocaleString("pt-BR",{maximumFractionDigits:2})} por real investido, captação incluída`:"sem leitura"}</div></div>
    <div class="kpi ${semAcesso?"alert":""}"><div class="lbl">Sem acesso ao tráfego</div><div class="val mono">${semAcesso}</div><div class="sub">${semAcesso?ativos.filter(e=>e.trafego?.status==="sem_acesso").map(e=>esc(e.nome.split(" ")[0])).join(", "):"todos lidos"}</div></div>`;
  $("#qCount").textContent = abertos;
}

/* ---------- render: board ---------- */
function renderBoard(){
  const ativos = experts.filter(e=>e.status!=="arquivado");
  // Só as etapas com alguém aparecem, para os números ficarem na tela.
  $("#board").innerHTML = STAGES.map((s,i)=>{
    const list = ativos.filter(e=>e.etapa===s.k).sort((a,b)=>(a.proximaData||"9")<(b.proximaData||"9")?-1:1);
    if(!list.length && ativos.length) return "";
    return `<div class="col">
      <div class="col-h"><div class="row"><span class="num">Etapa ${i+1}</span><span class="n">${list.length}</span></div><h3>${s.n}</h3></div>
      ${list.length? list.map(cardHtml).join("") : `<div class="empty">Ninguém nesta etapa</div>`}
    </div>`;
  }).join("");

  $("#archBox").hidden = !arq.length;
  $("#archSum").textContent = `Arquivados (${arq.length})`;
  $("#archList").innerHTML = arq.map(e=>`<button class="btn sm" data-open="${esc(e.id)}">${esc(e.nome)} · ${esc(e.motivo||"sem motivo")}</button>`).join("");
}
function ava(e, cls=""){
  const ok = typeof e.foto==="string" && /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(e.foto);
  return ok ? `<img class="ava ${cls}" src="${e.foto}" alt="">` : `<span class="ava ${cls}" aria-hidden="true">${esc((e.nome||"?").trim().charAt(0).toUpperCase())}</span>`;
}
function perfilHtml(e){
  const p = e.perfil; if(!p) return "";
  return `<div class="sec"><h3>Relatório do perfil</h3><p class="why">${esc(p.fonte||"")}</p>
    <div class="mgrid">${(p.metricas||[]).map(m=>`<div class="m"><div class="v mono">${esc(m.valor)}</div><div class="l">${esc(m.rotulo)}</div>${m.comparacao?`<div class="c">${esc(m.comparacao)}</div>`:""}</div>`).join("")}</div>
    ${p.leitura?`<div class="leitura"><b>Leitura:</b> ${esc(p.leitura)}</div>`:""}
    ${(p.relatorios||[]).length?`<ul class="docs">${p.relatorios.map(r=>`<li>${esc(r)}</li>`).join("")}</ul>`:""}
  </div>`;
}
// Tráfego: e.trafego = {status:"ok"|"sem_acesso", chip, fonte, periodo, resumo:[{rotulo,valor,comparacao,alerta}],
//   contas:[{nome,status,gasto,leads,cpl,vendas,cpa,faturamento,roas}], campanhas:[{nome,conta,status,gasto,resultado,custo,vendas,roas}],
//   leitura, pendencias:[texto]}. Os números chegam prontos em texto, do jeito que o relatório diário escreve.
function trafegoHtml(e){
  const t = e.trafego; if(!t) return "";
  const cel = v => `<td class="n">${esc(v??"—")}</td>`;
  const contas = (t.contas||[]).length ? `<div class="tr-h">Por conta</div><div class="tr-wrap"><table class="tr">
      <thead><tr><th>Conta</th><th class="n">Investido</th><th class="n">Leads</th><th class="n">CPL</th><th class="n">Vendas</th><th class="n">CPA</th><th class="n">Faturamento</th><th class="n">ROAS</th></tr></thead>
      <tbody>${t.contas.map(c=>`<tr><td class="nm">${esc(c.nome)}${c.status?`<span class="sub">${esc(c.status)}</span>`:""}</td>${cel(c.gasto)}${cel(c.leads)}${cel(c.cpl)}${cel(c.vendas)}${cel(c.cpa)}${cel(c.faturamento)}${cel(c.roas)}</tr>`).join("")}</tbody></table></div>` : "";
  const camps = (t.campanhas||[]).length ? `<div class="tr-h">Por campanha</div><div class="tr-wrap"><table class="tr">
      <thead><tr><th>Campanha</th><th class="n">Investido</th><th class="n">Resultado</th><th class="n">Custo</th><th class="n">Vendas</th><th class="n">ROAS</th></tr></thead>
      <tbody>${t.campanhas.map(c=>`<tr><td class="nm">${esc(c.nome)}<span class="sub">${esc([c.conta,c.status].filter(Boolean).join(" · "))}</span></td>${cel(c.gasto)}${cel(c.resultado)}${cel(c.custo)}${cel(c.vendas)}${cel(c.roas)}</tr>`).join("")}</tbody></table></div>` : "";
  return `<div class="sec"><div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap"><div><h3>Tráfego · investimento e resultado</h3><p class="why" style="margin:0">${esc([t.periodo,t.fonte].filter(Boolean).join(" · "))}</p></div>${t.status==="sem_acesso"?`<span class="pill bad">Sem acesso à conta</span>`:`<span class="pill good">Lido da conta</span>`}</div>
    ${(t.resumo||[]).length?`<div class="mgrid">${t.resumo.map(m=>`<div class="m ${m.alerta?"alerta":""}"><div class="v mono">${esc(m.valor)}</div><div class="l">${esc(m.rotulo)}</div>${m.comparacao?`<div class="c">${esc(m.comparacao)}</div>`:""}</div>`).join("")}</div>`:""}
    ${contas}${camps}
    ${t.leitura?`<div class="leitura"><b>Leitura:</b> ${esc(t.leitura)}</div>`:""}
    ${(t.pendencias||[]).length?`<ul class="pend">${t.pendencias.map(p=>`<li>${esc(p)}</li>`).join("")}</ul>`:""}
  </div>`;
}
// Até 4 números do resumo de tráfego no card do funil.
function cardNums(e){
  const r = (e.trafego?.resumo||[]).slice(0,4); if(!r.length || e.trafego.status!=="ok") return "";
  return `<div class="cnums">${r.map(m=>`<div><b class="mono">${esc(m.valor)}</b><span>${esc(m.rotulo)}</span></div>`).join("")}</div>`;
}
function estrategiaHtml(e){
  const it = (e.estrategia||[]).slice(0,3); if(!it.length) return "";
  return `<div class="sec"><h3>Estratégia</h3><ul class="estr">${it.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`;
}
function cardHtml(e){
  const p = stageProgress(e, e.etapa), sc = fitScore(e), pct = Math.round(p.done/p.total*100);
  const late = isLate(e);
  return `<button class="card" data-open="${esc(e.id)}" type="button">
    <div class="who-row">${ava(e)}<div><div class="nm">${esc(e.nome)}</div><div class="hd">${esc(e.handle||"")}${e.nicho?" · "+esc(e.nicho):""}</div></div></div>
    <div class="meta">${e.modelo?`<span class="pill acc">${esc(e.modelo)}</span>`:""}${e.trafego?`<span class="pill ${e.trafego.status==="sem_acesso"?"bad":"good"}">${esc(e.trafego.chip||(e.trafego.status==="sem_acesso"?"Tráfego sem acesso":"Tráfego"))}</span>`:""}</div>
    ${cardNums(e)}
    ${(e.estrategia||[])[0]?`<div class="next">${esc(e.estrategia[0])}</div>`:""}
  </button>`;
}

/* ---------- drawer ---------- */
function openDrawer(id){ openId=id; pendingMove=null; renderDrawer(); $("#scrim").hidden=false; $("#drawer").hidden=false; }
function closeDrawer(){ openId=null; $("#scrim").hidden=true; $("#drawer").hidden=true; }
function renderDrawer(){
  const e = experts.find(x=>x.id===openId); if(!e){ closeDrawer(); return; }
  const si = SK[e.etapa] ?? 0, s = STAGES[si], p = stageProgress(e, e.etapa), sc = fitScore(e);
  const dis = canWrite?"":"disabled";
  const scrollY = $("#drawer").scrollTop;
  $("#drawer").innerHTML = `
    <div class="d-head">
      <div class="d-id">${ava(e,"lg")}<div><h2>${esc(e.nome)}</h2><div class="hd">${esc(e.handle||"")}${e.nicho?" · "+esc(e.nicho):""}${e.status==="arquivado"?` · <span class="pill bad">Arquivado: ${esc(e.motivo||"")}</span>`:""}</div>${e.modelo?`<div style="margin-top:4px"><span class="pill acc">${esc(e.modelo)}</span></div>`:""}</div></div>
      <button class="btn sm" id="dClose" type="button" aria-label="Fechar">Fechar</button>
    </div>
    <div class="stepper">${STAGES.map((st,i)=>`<button class="step ${i<si?"past":i===si?"cur":""}" type="button" data-goto="${st.k}" ${dis} title="Mover para ${esc(st.n)}"><i></i><span>${esc(st.n)}</span></button>`).join("")}</div>

/* ---------- writes ---------- */
function ref(id){ return db.collection("experts").doc(id); }
async function save(id, patch, logTxt){
  if(!db){ toast("O painel ainda não conectou ao banco."); return; }
  const e = experts.find(x=>x.id===id);
  const body = {...patch, atualizadoEm:new Date().toISOString()};
  if(logTxt){ body.historico = [...(e?.historico||[]), {em:new Date().toISOString(), txt:logTxt}].slice(-60); }
  try{ await enqueue(id, ()=>ref(id).update(body)); }
  catch(err){ if(err?.code==="invalid_argument"&&!canWrite){} else if(err?.code==="invalid_argument"){ canWrite=false; renderDrawer(); toast("Você não tem permissão para editar este painel."); } else toast("Não salvou. Tente de novo em instantes."); }
}
function promptFor(e, s, a){
  const [who,skill,what]=a;
  return `${skill?`Use a skill ${skill}. `:""}Expert: ${e.nome}${e.handle?" ("+e.handle+")":""}${e.nicho?", nicho "+e.nicho:""}. Etapa do funil DN Grow: ${s.n}.
Tarefa (${who}): ${what}
${e.pasta?`Pasta do cliente: ${e.pasta}. Salve a entrega lá e em PDF.`:"Salve a entrega na pasta do cliente em Documents/Clientes, em PDF."}
${e.notas?`Contexto: ${e.notas}`:""}
Ao terminar, marque o pedido como feito na fila do DN Grow Experts.`.trim();
}

async function moveTo(e, k, force){
  const cur = SK[e.etapa], to = SK[k];
  if(to===cur) return;
  const p = stageProgress(e, e.etapa);
  if(to>cur && p.done<p.total && !force){
    pendingMove = {k, html:`<div class="confirm"><p>Faltam ${p.total-p.done} itens de <b>${esc(STAGES[cur].n)}</b>. Pular etapa costuma voltar como problema mais à frente.</p><button class="btn sm" type="button" data-cancelmove>Cancelar</button><button class="btn sm primary" type="button" data-forcemove="${k}">Avançar mesmo assim</button></div>`};
    renderDrawer(); return;
  }
  pendingMove=null;
  await save(e.id, {etapa:k}, `Moveu de ${STAGES[cur].n} para ${STAGES[to].n}${to>cur&&p.done<p.total?` com ${p.total-p.done} itens pendentes`:""}`);
}

document.addEventListener("click", async ev=>{
  const t = ev.target.closest("button,[data-open]"); if(!t) return;
  if(t.dataset.open){ openDrawer(t.dataset.open); return; }
  if(t.classList.contains("tab")){ setTab(t.dataset.tab); return; }
  if(t.id==="btnNovo"){ novo(); return; }
  if(t.id==="dClose"){ closeDrawer(); return; }
  if(t.dataset.qf){ qFilter=t.dataset.qf; renderQueue(); return; }
  if(t.dataset.qdel){ if(db) try{ await db.collection("pedidos").doc(t.dataset.qdel).delete(); toast("Pedido removido"); }catch{ toast("Não removeu."); } return; }
  if(t.dataset.qcopy){ const p=pedidos.find(x=>x.id===t.dataset.qcopy); copy(p?.prompt||""); return; }
  if(t.dataset.pl || t.dataset.plcopy || t.dataset.plask || t.dataset.plopen){ montagemClick(t); return; }
  const e = experts.find(x=>x.id===openId); if(!e) return;
  const s = STAGES[SK[e.etapa]??0];
  if(t.dataset.step){ const to = STAGES[(SK[e.etapa]??0)+Number(t.dataset.step)]; if(to) moveTo(e,to.k,false); return; }
  if(t.dataset.goto){ moveTo(e,t.dataset.goto,false); return; }
  if(t.dataset.forcemove){ moveTo(e,t.dataset.forcemove,true); return; }
  if(t.hasAttribute("data-cancelmove")){ pendingMove=null; renderDrawer(); return; }
  if(t.dataset.fit){ save(e.id,{fit:{...(e.fit||{}),[t.dataset.fit]:Number(t.dataset.v)}}); return; }
  if(t.dataset.copy){ copy(promptFor(e,s,s.agents[Number(t.dataset.copy)])); return; }
  if(t.dataset.ask){ const a=s.agents[Number(t.dataset.ask)];
    try{ await db.collection("pedidos").add({expertId:e.id, expertNome:e.nome, etapa:s.k, agente:a[0], skill:a[1], tarefa:a[2], prompt:promptFor(e,s,a), status:"afazer", criadoEm:new Date().toISOString()});
      await save(e.id,{},`Pedido para ${a[0]}: ${a[2]}`); toast(`Pedido enviado para ${a[0]}`);
    }catch{ toast("Não enviou o pedido. Tente de novo."); } return; }
  if(t.id==="dArch"){ pendingMove={html:`<div class="confirm"><p>Por que não seguiu?</p><input id="archMotivo" class="btn" style="flex:1 1 200px;text-align:left" placeholder="ex.: não quis investir em tráfego"><button class="btn sm primary" type="button" id="archOk">Arquivar</button><button class="btn sm" type="button" data-cancelmove>Cancelar</button></div>`}; renderDrawer(); $("#archMotivo")?.focus(); return; }
  if(t.id==="archOk"){ const m=$("#archMotivo")?.value.trim()||"sem motivo"; pendingMove=null; await save(e.id,{status:"arquivado",motivo:m},`Arquivado: ${m}`); return; }
  if(t.id==="dUnarch"){ await save(e.id,{status:"ativo",motivo:""},"Reativado"); return; }
});
document.addEventListener("change", ev=>{
  const el = ev.target; const e = experts.find(x=>x.id===openId);
  if(el.id==="mSel"){ mSel=el.value; try{localStorage.setItem("dngrow-m",mSel);}catch{} renderMontagem(); return; }
  if(el.id==="mInicio"){ const ex=experts.find(x=>x.id===mSel); if(!ex) return; const f=planOf(ex).base==="carrinho"?"dataCarrinho":"inicioTeste"; if((ex[f]||"")!==el.value) save(ex.id,{[f]:el.value},`${planOf(ex).rotuloData}: ${fmtDate(el.value)}`); return; }
  if(el.id==="mModelo"){ const ex=experts.find(x=>x.id===mSel); if(ex && el.value!==(ex.planoModelo||"perpetuo")) save(ex.id,{planoModelo:el.value},`Plano: ${PLANOS[el.value].nome}`); return; }
  if(el.dataset.qstat){ const id=el.dataset.qstat; if(db) enqueue("q"+id,()=>db.collection("pedidos").doc(id).update({status:el.value, atualizadoEm:new Date().toISOString()})).catch(()=>toast("Não salvou.")); return; }
  if(!e) return;
  if(el.dataset.chk){ const [sk,ik]=el.dataset.chk.split("."); const label=STAGES[SK[sk]].items.find(i=>i[0]===ik)[1];
    save(e.id,{checks:{...(e.checks||{}),[el.dataset.chk]:el.checked}}, `${el.checked?"Concluiu":"Desmarcou"}: ${label}`); return; }
  if(el.dataset.f){ const k=el.dataset.f; let v=el.value; if(el.type==="number") v = v===""?null:Number(v);
    if((e[k]??"")===(v??"")) return; save(e.id,{[k]:v}, k==="proximaAcao"&&v?`Próxima ação: ${v}`:null); }
});

async function copy(txt){
  try{ await navigator.clipboard.writeText(txt); toast("Pedido copiado. Cole no Claude."); }
  catch{ const ta=document.createElement("textarea"); ta.value=txt; document.body.appendChild(ta); ta.select(); try{document.execCommand("copy"); toast("Pedido copiado.");}catch{ toast("Selecione e copie o texto manualmente."); } ta.remove(); }
}
async function novo(){
  if(!db){ toast("O painel ainda não conectou ao banco."); return; }
  if(!canWrite){ toast("Você está em modo leitura."); return; }
  try{
    const r = await db.collection("experts").add({nome:"Novo expert", handle:"", nicho:"", origem:"", etapa:"radar", status:"ativo", checks:{}, fit:{}, responsavel:"", proximaAcao:"Registrar origem e produtos", proximaData:today(), criadoEm:new Date().toISOString(), atualizadoEm:new Date().toISOString(), historico:[{em:new Date().toISOString(), txt:"Entrou no Radar"}]});
    openId = r.id; setTimeout(()=>{ openDrawer(r.id); $("#f-nome")?.select(); }, 120);
  }catch(err){ toast(err?.code==="quota_exceeded"?"O banco do painel está cheio.":"Não criou. Tente de novo."); }
}

/* ---------- fila ---------- */
function renderQueue(){
  const filters=[["abertos","Abertos"],["afazer","A fazer"],["fazendo","Fazendo"],["feito","Feitos"],["todos","Todos"]];
  $("#qFilters").innerHTML = filters.map(([k,l])=>`<button class="chip" type="button" data-qf="${k}" aria-pressed="${qFilter===k}">${l}</button>`).join("");
  let list = pedidos.slice().sort((a,b)=>(b.criadoEm||"").localeCompare(a.criadoEm||""));
  if(qFilter==="abertos") list=list.filter(p=>p.status!=="feito"); else if(qFilter!=="todos") list=list.filter(p=>p.status===qFilter);
  const dis = canWrite?"":"disabled";
  $("#queue").innerHTML = list.length ? list.map(p=>`<div class="q"><div>
      <div class="top-line"><b>${esc(p.agente)}</b>${p.skill?`<span class="pill acc mono">${esc(p.skill)}</span>`:""}<span class="pill">${esc(p.expertNome)}</span><span class="pill">${esc(STAGES[SK[p.etapa]]?.n||p.etapa)}</span><span class="mono" style="font-size:11px;color:var(--muted)">${esc(fmtDate((p.criadoEm||"").slice(0,10)))}</span></div>
      <div class="task">${esc(p.tarefa)}</div></div>
      <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
        <select aria-label="Status do pedido" id="qs-${esc(p.id)}" data-qstat="${esc(p.id)}" ${dis}>${QSTAT.map(([k,l])=>`<option value="${k}" ${p.status===k?"selected":""}>${l}</option>`).join("")}</select>
        <button class="btn sm" type="button" data-qcopy="${esc(p.id)}">Copiar</button>
        ${canWrite?`<button class="btn sm ghost" type="button" data-qdel="${esc(p.id)}">Remover</button>`:""}
      </div></div>`).join("")
    : `<div class="notice">Nenhum pedido aqui. Abra um expert no Funil e use <b>Pedir</b> no agente da etapa. O Claude lê esta fila quando você disser “roda a fila do DN Grow”.</div>`;
}

const PST = {afazer:["A fazer",""], fazendo:["Fazendo","warn"], feito:["Feito","good"]};
let mSel = null; try{ mSel = localStorage.getItem("dngrow-m"); }catch{}

function planOf(e){ return PLANOS[e.planoModelo] || PLANOS.perpetuo; }
function planDate(e){ return planOf(e).base==="carrinho" ? (e.dataCarrinho||"") : (e.inicioTeste||""); }
function allItems(e){ return planOf(e).fases.flatMap(([fk,fn,,,,,its])=>its.map(([ik,t,q,novo])=>({key:fk+"."+ik, fase:fn, t, q, novo:!!novo}))); }
function plStatus(e,key){ return e.plano?.[key] || "afazer"; }
function plProgress(e, items){ const its = items || allItems(e); return {done: its.filter(i=>plStatus(e,i.key)==="feito").length, total: its.length}; }
function addDays(iso, n){ const d=new Date(iso+"T12:00:00"); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function faseRange(e, a, b){
  const base = planDate(e); if(!base) return null;
  return planOf(e).base==="carrinho" ? [addDays(base,a), addDays(base,b)] : [addDays(base,(a-1)*7), addDays(base,b*7-1)];
}
function plNext(e){ const all=allItems(e); return all.find(i=>plStatus(e,i.key)==="fazendo") || all.find(i=>plStatus(e,i.key)!=="feito"); }
function quemChip(q){ return AG[q] ? `<span class="pill acc">${esc(AG[q][0])}</span>` : `<span class="pill">${esc(QUEM[q]||q)}</span>`; }

function renderMontagem(){
  const box = $("#montagem"); if(!box) return;
  const lista = experts.filter(e=>e.status!=="arquivado");
  if(!lista.length){ box.innerHTML = `<div class="notice"><b>Nenhum expert no funil ainda.</b> A montagem do negócio aparece aqui quando houver um expert.</div>`; return; }
  if(!lista.find(e=>e.id===mSel)){ const pref = lista.find(e=>SK[e.etapa]>=SK.onboarding) || lista[0]; mSel = pref.id; }
  const e = lista.find(x=>x.id===mSel), pl = planOf(e);
  const g = plProgress(e), pct = Math.round(g.done/g.total*100), nx = plNext(e);
  const dis = canWrite?"":"disabled", base = planDate(e), hoje = today();
  const nNovos = allItems(e).filter(i=>i.novo).length;
  const fases = pl.fases.map(([fk,fn,a,b,obj,trava,its],fi)=>{
    const items = its.map(([ik,t,q,novo])=>({key:fk+"."+ik,t,q,novo:!!novo}));
    const p = plProgress(e, items), r = faseRange(e,a,b);
    const agora = r && r[0]<=hoje && hoje<=r[1];
    const late = r && r[1] < hoje && p.done<p.total;
    const quando = r ? `<span class="mono">${fmtDate(r[0])}</span> a <span class="mono">${fmtDate(r[1])}</span>` : (pl.base==="carrinho" ? "defina a abertura do carrinho" : (a===b?`Semana ${a}`:`Semanas ${a}–${b}`));
    return `<details class="fase ${agora?"now":""}" ${p.done<p.total?"open":""}>
      <summary><span class="fn mono">Fase ${fi+1}</span><span class="ft">${esc(fn)}</span><span class="fw">${quando}</span>
        ${agora?`<span class="pill acc">Agora</span>`:""}<span class="pill ${p.done===p.total?"good":late?"bad":""}">${p.done}/${p.total}${late?" · atrasada":""}</span></summary>
      <p class="why" style="margin-top:6px">${esc(obj)}</p>${trava?`<div class="gate">${esc(trava)}</div>`:""}
      <div class="plitems">${items.map(it=>{ const s=plStatus(e,it.key); const ag=AG[it.q];
        return `<div class="pli ${s}"><button type="button" class="pst pill ${PST[s][1]}" data-pl="${it.key}" ${dis} title="Mudar o status">${PST[s][0]}</button>
          <span class="plt">${esc(it.t)}${it.novo?` <span class="pill novo">acrescentado</span>`:""}</span><span class="plq">${quemChip(it.q)}</span>
          ${ag?`<span class="plb"><button class="btn sm" type="button" data-plcopy="${it.key}">Copiar</button><button class="btn sm primary" type="button" data-plask="${it.key}" ${dis}>Pedir</button></span>`:`<span class="plb"></span>`}</div>`; }).join("")}</div>
    </details>`;
  }).join("");
  box.innerHTML = `
    <div class="mhead">
      <div class="d-id">${ava(e,"lg")}<div><h2 style="font-size:22px">${esc(e.nome)}</h2><div class="hd" style="color:var(--muted)">${esc(e.modelo||"")}${e.modelo?" · ":""}etapa ${esc(STAGES[SK[e.etapa]]?.n||"")}</div></div></div>
      <div class="mctl">
        <div class="fld"><label for="mSel">Expert</label><select id="mSel">${lista.map(x=>`<option value="${esc(x.id)}" ${x.id===mSel?"selected":""}>${esc(x.nome)}</option>`).join("")}</select></div>
        <div class="fld"><label for="mModelo">Modelo do plano</label><select id="mModelo" ${dis}>${Object.entries(PLANOS).map(([k,v])=>`<option value="${k}" ${planOf(e)===v?"selected":""}>${esc(v.nome)}</option>`).join("")}</select></div>
        <div class="fld"><label for="mInicio">${esc(pl.rotuloData)}</label><input type="date" id="mInicio" value="${esc(base)}" ${dis}></div>
      </div>
    </div>
    <div class="mtop">
      <div class="kpi"><div class="lbl">Montagem concluída</div><div class="val mono">${pct}%</div><div class="bar ${pct===100?"done":""}" style="margin-top:6px"><i style="width:${pct}%"></i></div><div class="sub">${g.done} de ${g.total} itens</div></div>
      <div class="kpi nextbox"><div class="lbl">Próximo passo</div>${nx?`<div class="nt">${esc(nx.t)}</div><div class="sub">${esc(nx.fase)} · ${AG[nx.q]?esc(AG[nx.q][0]):esc(QUEM[nx.q]||"")}</div>`:`<div class="nt">Tudo pronto. Hora de ler os marcos.</div>`}</div>
    </div>
    ${e.planoNota?`<div class="leitura" style="margin-top:12px"><b>Leitura do plano:</b> ${esc(e.planoNota)}</div>`:""}
    <p class="why" style="margin:14px 0 0">Clique no status para avançar: a fazer → fazendo → feito.${nNovos?` Os ${nNovos} itens marcados como <span class="pill novo">acrescentado</span> não estavam no cronograma original.`:""}${base?"":` Preencha “${esc(pl.rotuloData)}” para ver as datas de cada fase.`}</p>
    <div class="fases">${fases}</div>`;
}
async function montagemClick(t){
  const e = experts.find(x=>x.id===(t.dataset.plopen||mSel)); if(!e) return;
  if(t.dataset.plopen){ mSel=e.id; closeDrawer(); setTab("montagem"); renderMontagem(); return; }
  const key = t.dataset.pl||t.dataset.plcopy||t.dataset.plask; const it = allItems(e).find(i=>i.key===key); if(!it) return;
  if(t.dataset.pl){ const cur=plStatus(e,key); const nxt = cur==="afazer"?"fazendo":cur==="fazendo"?"feito":"afazer";
    save(e.id,{plano:{...(e.plano||{}),[key]:nxt}}, `Montagem · ${it.t}: ${PST[nxt][0].toLowerCase()}`); return; }
  const a = AG[it.q]; if(!a) return;
  const s = {n:`Montagem do negócio · ${it.fase}`};
  const ag = [a[0], a[1], it.t];
  if(t.dataset.plcopy){ copy(promptFor(e,s,ag)); return; }
  if(!db) return;
  try{ await db.collection("pedidos").add({expertId:e.id, expertNome:e.nome, etapa:e.etapa, plano:key, agente:a[0], skill:a[1], tarefa:`${it.fase}: ${it.t}`, prompt:promptFor(e,s,ag), status:"afazer", criadoEm:new Date().toISOString()});
    const patch = plStatus(e,key)==="afazer" ? {plano:{...(e.plano||{}),[key]:"fazendo"}} : {};
    await save(e.id, patch, `Pedido para ${a[0]}: ${it.t}`); toast(`Pedido enviado para ${a[0]}`);
  }catch{ toast("Não enviou o pedido. Tente de novo."); }
}

function setTab(k){
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected", String(b.dataset.tab===k)));
  ["numeros","funil","montagem","fila","metodo"].forEach(x=>$("#p-"+x).hidden = x!==k);
  try{ localStorage.setItem("dngrow-tab2",k); }catch{}
  if(k==="numeros") ajustarNumeros();
}

function renderAll(){ renderKpis(); renderBoard(); renderQueue(); renderMontagem(); if(openId) renderDrawer(); }

/* ---------- boot ---------- */
renderMethod(); renderKpis(); renderBoard(); renderQueue();
// A aba Números é a página DN Grow Projetos embutida (iframe srcdoc, mesmo documento); a altura acompanha o conteúdo.
function ajustarNumeros(){
  const f = $("#numerosFrame"); if(!f) return;
  const fit = () => { try{ const d=f.contentDocument; if(d&&d.body) f.style.height = Math.max(600, d.documentElement.scrollHeight) + "px"; }catch{} };
  fit();
  if(!f._obs){ try{ f._obs = new ResizeObserver(fit); f._obs.observe(f.contentDocument.body); }catch{} }
}
$("#numerosFrame")?.addEventListener("load", ()=>{ $("#numerosFrame")._obs=null; ajustarNumeros(); });
try{ const t=localStorage.getItem("dngrow-tab2"); if(t) setTab(t); }catch{}
async function bootStatic(){
  // Versão do GitHub Pages: lê a foto do funil em dados.json, só leitura.
  try{
    const r = await fetch("dados.json",{cache:"no-store"}); if(!r.ok) throw 0;
    const d = await r.json();
    experts = d.experts||[]; pedidos = d.pedidos||[]; canWrite=false;
    $("#btnNovo").hidden = true;
    $("#boardStatus").hidden = experts.length>0;
    if(!experts.length) $("#boardStatus").innerHTML = "<b>Nenhum expert no funil ainda.</b>";
    const b=document.createElement("div"); b.className="banner";
    b.innerHTML=`<span class="pill">Versão online · só leitura</span><span>Atualizada em <span class="mono">${esc(d.atualizadoEm||"")}</span>. As edições são feitas no painel do Claude.</span>`;
    $("#p-funil").prepend(b);
    renderAll();
  }catch{ $("#boardStatus").innerHTML = "<b>Não foi possível carregar os dados do funil.</b> Recarregue a página."; $("#btnNovo").hidden=true; }
}
(async()=>{
  if(!window.claude?.use){ bootStatic(); return; }
  db = await window.claude.use("db") ?? null;
  const user = await window.claude?.use?.("user") ?? null;
  if(!db){ $("#boardStatus").innerHTML = "<b>Não foi possível abrir o banco do painel.</b> Entre na sua conta do Claude para ver e editar os experts."; $("#btnNovo").disabled=true; return; }
  try{ const c = await user?.can?.("data.write"); if(c===false){ canWrite=false; $("#btnNovo").disabled=true; } }catch{}
  db.collection("experts").onSnapshot(snap=>{
    experts = snap.docs.map(d=>({id:d.id,...d.data()}));
    $("#boardStatus").hidden = experts.length>0;
    if(!experts.length) $("#boardStatus").innerHTML = "<b>Nenhum expert no funil ainda.</b> Clique em “+ Novo expert” para colocar o primeiro no Radar.";
    renderAll();
  }, ()=>{ $("#boardStatus").hidden=false; $("#boardStatus").innerHTML="<b>A conexão com o banco caiu.</b> Recarregue a página."; });
  db.collection("pedidos").onSnapshot(snap=>{ pedidos = snap.docs.map(d=>({id:d.id,...d.data()})); renderKpis(); renderQueue(); }, ()=>{});
})();
